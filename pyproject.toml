[project]
name = "slacktivity"
version = "0.1.0"
description = "Live terminal feed of recent Slack messages with mark-as-read, authed via your browser session token (no org app install)."
authors = [
    { name = "Aaron Mandle", email = "879468+amandle@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "textual>=0.60",
]

[project.scripts]
slacktivity = "slacktivity:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
