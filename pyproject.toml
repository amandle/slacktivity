[project]
name = "activity"
version = "0.2.0"
description = "Live terminal feed of your notifications — Slack messages and Gmail mail — with local mark-as-read triage."
authors = [
    { name = "Aaron Mandle", email = "879468+amandle@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "textual>=0.60",
]

[project.scripts]
activity = "activity:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
